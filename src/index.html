<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Image Board" />
    <meta name="author" content="Dylan Mannan" />
    <meta name="keywords" content="Image Sharing, Image Blog" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <title>Spots</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img alt="Spots logo" class="header__logo" />
      </header>
      <main class="content">
        <section class="profile page__section">
          <div class="profile__avatar-container">
            <button class="profile__avatar-btn">
              <img
                class="profile__pencil-icon"
                src="./images/Pencilwhite.svg"
                alt="Pencil Icon"
              />
            </button>
            <img alt="Bessie Coleman" class="profile__avatar" />
          </div>
          <div class="profile__column">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button type="button" class="profile__edit-btn">
              <img alt="Pencil Icon" class="profile__pencilImg" />Edit Profile
            </button>
          </div>
          <button type="button" class="profile__add-btn">
            <img alt="Plus Icon" class="plus__icon" />New Post
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button class="card__delete-btn" type="button"></button>
                <img src="#" alt="" class="card__image" />
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <button type="button" class="card__like-btn"></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__copyrite">copyrite 2023 © Spots</p>
      </footer>
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <button type="button">
            <img
              src="./images/closebtn.svg"
              alt="closebtn"
              class="modal__close-btn"
            />
          </button>
          <h2 class="modal__title">Edit Profile</h2>
          <form class="modal__form" novalidate>
            <label for="profile-name-input" class="modal__label">
              Name
              <input
                id="profile-name-input"
                type="text"
                class="modal__input"
                placeholder="Type You're Name"
                minlength="2"
                maxlength="40"
                required
              />
              <span id="profile-name-input-error" class="modal__error"></span>
            </label>
            <label for="profile-description-input" class="modal__label">
              Description
              <input
                id="profile-description-input"
                type="text"
                class="modal__input"
                placeholder="Describe Yourself"
                minlength="2"
                maxlength="200"
                required
              />
              <span
                id="profile-description-input-error"
                class="modal__error"
              ></span>
            </label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <button type="button">
            <img
              src="./images/closebtn.svg"
              alt="closebtn"
              class="modal__close-btn"
            />
          </button>
          <h2 class="modal__title">New Post</h2>
          <form class="modal__form" novalidate>
            <label for="card-image-input" class="modal__label">
              Image Link
              <input
                id="card-image-input"
                type="url"
                class="modal__input"
                placeholder="Paste a link to the picture"
                required
              />
              <span id="card-image-input-error" class="modal__error"></span>
            </label>
            <label for="profile-caption-input" class="modal__label">
              Caption
              <input
                id="profile-caption-input"
                type="text"
                class="modal__input"
                placeholder="Type a caption"
                minlength="2"
                maxlength="30"
                required
              />
              <span
                id="profile-caption-input-error"
                class="modal__error"
              ></span>
            </label>
            <button type="submit" class="modal__submit-btn">Save</button>
          </form>
        </div>
      </div>
    </div>

    <div class="modal modal_type_preview" id="preview-modal">
      <div class="modal__image-container">
        <button
          type="button"
          class="modal__close-btn modal__close-btn_type_preview"
        >
          <img alt="" />
        </button>
        <img src="#" alt="" class="modal__image" />
        <h2 class="modal__caption"></h2>
      </div>
    </div>

    <div class="modal" id="avatar-modal">
      <div class="modal__container">
        <button type="button">
          <img
            src="./images/closebtn.svg"
            alt="closebtn"
            class="modal__close-btn"
          />
        </button>
        <h2 class="modal__title">Edit Profile Avatar</h2>
        <form class="modal__form" novalidate>
          <label for="profile-avatar-input" class="modal__label">
            Profile Picture
            <input
              id="profile-avatar-input"
              type="url"
              class="modal__input"
              name="Avatar"
              placeholder="Avatar Goes Here"
              required
            />
            <span id="profile-avatar-input-error" class="modal__error"></span>
          </label>
          <button type="submit" class="modal__submit-btn">Save</button>
        </form>
      </div>
    </div>

    <div class="modal" id="delete-modal">
      <div class="modal__container" id="delete-modal__container">
        <button type="button">
          <img
            src="./images/closebtn.svg"
            alt="closebtn"
            class="modal__close-btn"
          />
        </button>
        <h2 class="modal__title" id="delete__form_modal_title">
          Are you sure you want to delete this image?
        </h2>
        <form class="modal__form" id="delete__form_submit-btns" novalidate>
          <button
            type="submit"
            class="modal__submit-btn"
            id="delete__form_delete_btn"
          >
            Delete
          </button>
          <button
            type="button"
            class="modal__submit-btn"
            id="delete__form_cancel_btn"
          >
            Cancel
          </button>
        </form>
      </div>
    </div>
  </body>
</html>
